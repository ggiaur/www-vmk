version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vmk-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URI=postgres://vmk_user:vmk_password@postgres:5432/vmk_db
      - PAYLOAD_SECRET=vmk_super_secret_payload_key_2026
      - NEXT_PUBLIC_SERVER_URL=http://localhost:3000
      - MEILISEARCH_HOST=http://meilisearch:7700
      - MEILISEARCH_KEY=vmk_meili_master_key
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ROOT_USER=minio_admin
      - MINIO_ROOT_PASSWORD=minio_password
      - MINIO_BUCKET=vmk-media
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_started
      minio:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: vmk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vmk_db
      POSTGRES_USER: vmk_user
      POSTGRES_PASSWORD: vmk_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vmk_user -d vmk_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: vmk-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_password
    volumes:
      - minio_data:/data

  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: vmk-meilisearch
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: vmk_meili_master_key
      MEILI_ENV: development
    volumes:
      - meili_data:/meili_data

volumes:
  postgres_data:
  minio_data:
  meili_data:
