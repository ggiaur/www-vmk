name: VMK CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Dependencies
        run: npm install
      - name: Type Check
        run: npm run type-check

  unit-tests:
    name: Vitest Unit & RSC Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Dependencies
        run: npm install
      - name: Run Unit Tests
        run: npm run test:unit

  e2e-and-accessibility:
    name: Playwright E2E & WCAG 2.2 AA Audit
    runs-on: ubuntu-latest
    needs: unit-tests
    # J2.1 (COLLAB.md): this job used to run `npm run test:e2e` with no app
    # server running at all, while playwright.config.ts points at
    # http://localhost:3001 -- every spec failed with ERR_CONNECTION_REFUSED.
    # This orchestrates the same services docker-compose.yml defines for
    # local dev (Postgres/MinIO/Meilisearch), builds and starts the real
    # production app against them, and waits on real HTTP readiness checks
    # (never a fixed sleep) before handing off to Playwright.
    env:
      DATABASE_URI: postgres://vmk_user:vmk_password@localhost:5432/vmk_db
      PAYLOAD_SECRET: vmk_ci_ephemeral_secret_not_used_outside_ci
      PORT: '3001'
      NEXT_PUBLIC_SERVER_URL: http://localhost:3001
      MEILISEARCH_HOST: http://localhost:7700
      MEILISEARCH_KEY: vmk_meili_master_key
      MINIO_ENDPOINT: localhost
      MINIO_PORT: '9000'
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_password
      MINIO_BUCKET: vmk-media
      MINIO_USE_SSL: 'false'
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Dependencies
        run: npm install
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Start Postgres/MinIO/Meilisearch (docker-compose.yml)
        run: docker compose up -d postgres minio meilisearch

      - name: Wait for Postgres readiness
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready -U vmk_user -d vmk_db > /dev/null 2>&1; then
              echo "Postgres ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Postgres did not become ready in time"
          docker compose logs postgres
          exit 1

      - name: Wait for MinIO readiness
        run: |
          for i in $(seq 1 30); do
            if curl -sS -o /dev/null -w '%{http_code}' http://localhost:9000/minio/health/live 2>/dev/null | grep -q 200; then
              echo "MinIO ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::MinIO did not become ready in time"
          docker compose logs minio
          exit 1

      - name: Wait for Meilisearch readiness
        run: |
          for i in $(seq 1 30); do
            if curl -sS -o /dev/null -w '%{http_code}' http://localhost:7700/health 2>/dev/null | grep -q 200; then
              echo "Meilisearch ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Meilisearch did not become ready in time"
          docker compose logs meilisearch
          exit 1

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # A fresh CI Postgres has zero tables. `push:false` (payload.config.ts)
      # deliberately disables Payload's interactive dev-mode schema-push --
      # confirmed live (COLLAB.md J2.1) that push:true also can't fill this
      # gap in CI: with no TTY attached it silently exits without creating
      # any schema at all, rather than hanging or auto-applying. So this
      # applies a plain, reviewable SQL schema dump instead of touching push
      # at all. Regenerate this file (`pg_dump --schema-only`) whenever a
      # new migrations/sql/*.sql lands -- it's a point-in-time snapshot of
      # the schema those migrations produce, not a substitute for them.
      - name: Bootstrap database schema
        run: |
          PGPASSWORD=vmk_password psql -h localhost -U vmk_user -d vmk_db -v ON_ERROR_STOP=1 -f migrations/sql/ci_baseline_schema.sql

      - name: Create MinIO bucket
        run: |
          docker compose exec -T minio mc alias set local http://localhost:9000 minio_admin minio_password
          docker compose exec -T minio mc mb local/vmk-media --ignore-existing

      - name: Build application
        run: npm run build

      - name: Start application
        run: |
          nohup npm run start -- -p 3001 > app-server.log 2>&1 &
          disown

      - name: Wait for application readiness
        run: |
          for i in $(seq 1 60); do
            if curl -sS -o /dev/null -w '%{http_code}' http://localhost:3001/ 2>/dev/null | grep -q 200; then
              echo "App ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Application did not become ready in time"
          cat app-server.log || true
          exit 1

      - name: Run Playwright Tests
        run: npm run test:e2e

      - name: Show application logs on failure
        if: failure()
        run: cat app-server.log || true

      - name: Stop application
        if: always()
        run: pkill -f "next-server" || true

      - name: Tear down services
        if: always()
        run: docker compose down -v
